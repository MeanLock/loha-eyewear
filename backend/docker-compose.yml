version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loha_eyewear
      POSTGRES_USER: loha_user
      POSTGRES_PASSWORD: loha_dev_2024
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: loha_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@loha.vn
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5051:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
